{% extends "base.html" %}
{% block title %}Sign in · MCP Access{% endblock %}
{% block body %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark">MA</div>
    <h1 class="auth-title">MCP Access</h1>
    <p class="auth-subtitle">Sign in to manage who can reach Cynet's internal MCP servers.</p>

    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}

    <a class="btn btn-primary" href="/login">
      <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.4 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.4 29.5 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 45c5.4 0 10.3-2.1 14-5.5l-6.5-5.5C29.4 35.7 26.8 36.5 24 36.5c-5.3 0-9.7-3.6-11.3-8.5l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.6l6.5 5.5C41 36.4 44 30.9 44 24c0-1.4-.1-2.4-.4-3.5z"/>

    </a>
  </div>
</div>
{% endblock %}
